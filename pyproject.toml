[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["notebooks/", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # неиспользуемые импорты в __init__

[tool.ruff.format]
quote-style = "double"
